
# Question 4: CI/CD & GitHub Skills (15 points)

# Context: Your repository needs a GitHub Actions workflow for automated testing and building

# Task:
# 1. Triggers on push to the main branch
# 2. Runs npm install and npm run build for the frontend
# 3. Runs mvn test for the Java backend

name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: student-template/frontend
        run: npm install

      - name: Build frontend
        working-directory: student-template/frontend
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: student-template/backend/java
        run: mvn test
